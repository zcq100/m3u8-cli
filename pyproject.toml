[project]
name = "m3u8-cli"
version = "0.1.0"
description = "HLS（m3u8）视频下载器"
readme = "README.md"
authors = [
    { name = "r1a", email = "m@zcq100.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pycryptodome>=4.0.1",
    "requests>=2.34.2",
]

[project.scripts]
m3u8-cli = "m3u8_cli.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[project]
name = "m3u8-cli"
version = "0.2.2"
description = "HLS 视频下载与格式转换工具"
readme = "README.md"
authors = [
    { name = "r1a", email = "m@zcq100.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pycryptodome>=4.0.1",
    "requests>=2.34.2",
]

[project.scripts]
m3u8-cli = "m3u8_cli.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# sdist 中附带 Chrome 扩展源码与打包脚本，wheel 仍只包含 Python 包。
source-include = [
    "chrome-extension/**",
    "scripts/build_extension.py",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
